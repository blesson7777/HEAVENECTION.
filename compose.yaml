name: heavenection
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: heavenection
      POSTGRES_USER: heavenection
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heavenection -d heavenection"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  postgres_data:
